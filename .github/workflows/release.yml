name: Release

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Module to release (root, openai, anthropic, google-genai, mcp, adk)"
        required: true
        type: choice
        options:
          - root
          - openai
          - anthropic
          - google-genai
          - mcp
          - adk
      version:
        description: "Version tag (e.g. v0.6.0)"
        required: true
        type: string

jobs:
  release:
    name: Release ${{ inputs.module }} ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_MODULE: ${{ inputs.module }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Validate version format
        run: |
          if ! echo "$RELEASE_VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: version must match vMAJOR.MINOR.PATCH (e.g. v0.6.0), got: $RELEASE_VERSION"
            exit 1
          fi

      - name: Validate root version matches Version constant
        if: ${{ inputs.module == 'root' }}
        run: |
          expected="v$(grep -oP '^const Version = "\K[^"]+' version.go)"
          if [ "$RELEASE_VERSION" != "$expected" ]; then
            echo "ERROR: root release version $RELEASE_VERSION does not match Version constant $expected"
            exit 1
          fi

      - name: Validate all modules (workspace mode)
        if: ${{ inputs.module == 'root' }}
        run: |
          go mod tidy
          go vet ./...
          go test ./...
          go build ./...
          cd instrumentation/openai && go mod tidy && go vet ./... && go test ./... && go build ./...
          cd ../anthropic && go mod tidy && go vet ./... && go test ./... && go build ./...
          cd ../google-genai && go mod tidy && go vet ./... && go test ./... && go build ./...
          cd ../mcp && go mod tidy && go vet ./... && go test ./... && go build ./...
          cd ../adk && go mod tidy && go vet ./... && go test ./... && go build ./...

      - name: Validate downstream consumers
        if: ${{ inputs.module == 'root' }}
        run: |
          cd test/downstream/root-only && GOWORK=off go build ./...
          cd ../openai-only && GOWORK=off go build ./...
          cd ../anthropic-only && GOWORK=off go build ./...
          cd ../google-genai-only && GOWORK=off go build ./...
          cd ../mcp-only && GOWORK=off go build ./...
          cd ../adk-only && GOWORK=off go build ./...

      - name: Validate adapter against published core (no-replace)
        if: ${{ inputs.module != 'root' }}
        run: |
          mod_dir="instrumentation/$RELEASE_MODULE"
          cd "$mod_dir"
          # Verify the adapter can resolve its declared core requirement
          # from the Go proxy (no local replace). This is the required
          # no-replace consumer check after core publication.
          GOWORK=off go mod download
          GOWORK=off go vet ./...
          GOWORK=off go test ./...
          GOWORK=off go build ./...

      - name: Determine tag
        id: tag
        run: |
          case "$RELEASE_MODULE" in
            root)
              echo "tag=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
              ;;
            openai|anthropic|google-genai|mcp|adk)
              echo "tag=instrumentation/$RELEASE_MODULE/$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Create tag
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          git tag "$tag"
          git push origin "$tag"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ startsWith(inputs.version, 'v0.') }}
