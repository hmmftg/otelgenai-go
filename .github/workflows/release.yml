name: Release

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Module to release (root, openai, anthropic, google-genai, mcp, adk)"
        required: true
        type: choice
        options:
          - root
          - openai
          - anthropic
          - google-genai
          - mcp
          - adk
      version:
        description: "Version tag (e.g. v0.6.0)"
        required: true
        type: string

jobs:
  release:
    name: Release ${{ inputs.module }} ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_MODULE: ${{ inputs.module }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Validate version format
        run: |
          if ! echo "$RELEASE_VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: version must match vMAJOR.MINOR.PATCH (e.g. v0.6.0), got: $RELEASE_VERSION"
            exit 1
          fi

      - name: Determine tag
        id: tag
        run: |
          case "$RELEASE_MODULE" in
            root)
              echo "tag=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
              ;;
            openai|anthropic|google-genai|mcp|adk)
              echo "tag=instrumentation/$RELEASE_MODULE/$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Guard tag absence
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "ERROR: tag $tag already exists locally"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
            echo "ERROR: tag $tag already exists on origin"
            exit 1
          fi

      - name: Guard branch and clean source
        run: |
          branch="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$branch" != "main" ]; then
            echo "ERROR: releases must run from main (currently on $branch)"
            exit 1
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "ERROR: working tree is not clean"
            exit 1
          fi

      - name: Validate root version matches Version constant
        if: ${{ inputs.module == 'root' }}
        run: |
          expected="v$(grep -oP '^const Version = "\K[^"]+' version.go)"
          if [ "$RELEASE_VERSION" != "$expected" ]; then
            echo "ERROR: root release version $RELEASE_VERSION does not match Version constant $expected"
            exit 1
          fi

      - name: Validate adapter requires published core
        if: ${{ inputs.module != 'root' }}
        run: |
          cd "instrumentation/$RELEASE_MODULE"
          core_req=$(grep -oP 'github.com/hmmftg/otelgenai-go \Kv\S+' go.mod | head -1)
          if [ -z "$core_req" ]; then
            echo "ERROR: adapter does not declare a core requirement"
            exit 1
          fi
          if ! git ls-remote --tags origin "refs/tags/$core_req" | grep -q "$core_req"; then
            echo "ERROR: declared core requirement $core_req is not a published tag on origin"
            exit 1
          fi

      - name: Validate all modules (workspace mode)
        if: ${{ inputs.module == 'root' }}
        run: |
          go mod tidy -diff
          go vet ./...
          go test ./...
          go build ./...

      - name: Validate adapter module (workspace mode)
        if: ${{ inputs.module != 'root' }}
        run: |
          cd "instrumentation/$RELEASE_MODULE"
          go mod tidy -diff
          go vet ./...
          go test ./...
          go build ./...

      - name: Validate downstream consumers
        if: ${{ inputs.module == 'root' }}
        run: |
          cd test/downstream/root-only && GOWORK=off go build ./...
          cd ../openai-only && GOWORK=off go build ./...
          cd ../anthropic-only && GOWORK=off go build ./...
          cd ../google-genai-only && GOWORK=off go build ./...
          cd ../mcp-only && GOWORK=off go build ./...
          cd ../adk-only && GOWORK=off go build ./...

      - name: Validate adapter against published core (sanitized no-replace)
        if: ${{ inputs.module != 'root' }}
        run: |
          sh scripts/validate-no-replace.sh "instrumentation/$RELEASE_MODULE"

      - name: Create tag
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          git tag "$tag"
          git push origin "$tag"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ startsWith(inputs.version, 'v0.') }}
