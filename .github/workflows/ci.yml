name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.module }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        module: [root, openai, anthropic, google-genai, mcp, adk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Go vet
        working-directory: ${{ matrix.module == 'root' && '.' || format('instrumentation/{0}', matrix.module) }}
        run: go vet ./...
      - name: Go build
        working-directory: ${{ matrix.module == 'root' && '.' || format('instrumentation/{0}', matrix.module) }}
        run: go build ./...
      - name: Go test
        working-directory: ${{ matrix.module == 'root' && '.' || format('instrumentation/{0}', matrix.module) }}
        run: go test ./...

  tidy:
    name: Go mod tidy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Tidy all modules
        run: |
          go mod tidy
          cd instrumentation/openai && go mod tidy
          cd ../anthropic && go mod tidy
          cd ../google-genai && go mod tidy
          cd ../mcp && go mod tidy
          cd ../adk && go mod tidy
          cd ../.. && git diff --exit-code

  boundary:
    name: Internal-import boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no production adapter imports of internal/*
        run: |
          set -e
          # Find non-test .go files in adapter packages that import internal/*
          matches=$(grep -rn 'github.com/hmmftg/otelgenai-go/internal/' \
            --include='*.go' --exclude='*_test.go' \
            instrumentation/ || true)
          if [ -n "$matches" ]; then
            echo "ERROR: production adapter files import internal/* packages:"
            echo "$matches"
            exit 1
          fi

  test-race:
    name: Race test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [root, openai, anthropic, google-genai, mcp, adk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Race test
        working-directory: ${{ matrix.module == 'root' && '.' || format('instrumentation/{0}', matrix.module) }}
        run: go test -race ./...

  downstream:
    name: Downstream consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Root-only consumer
        run: cd test/downstream/root-only && GOWORK=off go build ./...
      - name: OpenAI-only consumer
        run: cd test/downstream/openai-only && GOWORK=off go build ./...
      - name: Anthropic-only consumer
        run: cd test/downstream/anthropic-only && GOWORK=off go build ./...
      - name: Google GenAI-only consumer
        run: cd test/downstream/google-genai-only && GOWORK=off go build ./...
      - name: MCP-only consumer
        run: cd test/downstream/mcp-only && GOWORK=off go build ./...
      - name: ADK-only consumer
        run: cd test/downstream/adk-only && GOWORK=off go build ./...

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Run benchmarks
        run: go test -bench=. -benchmem ./... | tee benchmarks.txt
      - name: Upload benchmarks
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: benchmarks.txt
